name: bot-tick

# Cron Vercel Hobby hanya sekali sehari, jadi penjadwal jam-an memakai GitHub Actions.
# Menit ke-7 (bukan 0) supaya tidak bertabrakan dengan beban puncak penjadwal lain.

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

concurrency:
  group: bot-tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Panggil /api/tick
        env:
          BOT_URL: ${{ secrets.BOT_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${BOT_URL:-}" ] || [ -z "${CRON_SECRET:-}" ]; then
            echo "Secret BOT_URL dan CRON_SECRET belum diisi di repo GitHub." >&2
            exit 1
          fi
          curl --fail-with-body --silent --show-error \
            --max-time 290 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${BOT_URL%/}/api/tick"
